name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 1.97
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - run: cargo +1.88 check --workspace --all-targets --locked

  packaging:
    name: Lab package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - id: source
        name: Record exact source commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: 0.70.0
      - name: Shellcheck packaging scripts
        run: shellcheck scripts/build-lab-package.sh scripts/verify-packaging.sh packaging/lxc/install.sh packaging/tests/package-smoke.sh
      - name: Verify packaging policy
        run: scripts/verify-packaging.sh
      - name: Build lab package
        run: scripts/build-lab-package.sh
      - name: Smoke test package
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          artifact_dir="dist/$SOURCE_SHA"
          mapfile -t archives < <(find "$artifact_dir" -maxdepth 1 -type f -name 'rustsdcmcp_*_amd64.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "${archive}.sha256"
          test ! -L "$archive"
          test ! -L "${archive}.sha256"
          mapfile -t artifact_entries < <(find -P "$artifact_dir" -mindepth 1 -maxdepth 1 -printf '%f\t%y\n' | LC_ALL=C sort)
          test "${#artifact_entries[@]}" -eq 2
          test "${artifact_entries[0]}" = "$(basename -- "$archive")"$'\t'f
          test "${artifact_entries[1]}" = "$(basename -- "${archive}.sha256")"$'\t'f
          packaging/tests/package-smoke.sh "$archive"
      - name: Verify package metadata and SBOM
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          artifact_dir="dist/$SOURCE_SHA"
          mapfile -t archives < <(find "$artifact_dir" -maxdepth 1 -type f -name 'rustsdcmcp_*_amd64.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          mapfile -t build_infos < <(tar -tzf "$archive" | grep -E '/BUILD-INFO$')
          test "${#build_infos[@]}" -eq 1
          build_info="$(tar -xOf "$archive" "${build_infos[0]}")"
          printf '%s\n' "$build_info" | grep -Fx 'release_status=lab-only'
          printf '%s\n' "$build_info" | grep -Fx "git_commit=$SOURCE_SHA"
          printf '%s\n' "$build_info" | grep -Fx 'mecmcp_ref=changeset-v0.3.6'
          printf '%s\n' "$build_info" | grep -E '^glibc_floor=[0-9]+(\.[0-9]+)+$'
          mapfile -t sboms < <(tar -tzf "$archive" | grep -E '/SBOM\.cdx\.json$')
          test "${#sboms[@]}" -eq 1
          tar -xOf "$archive" "${sboms[0]}" | jq -e '
            .bomFormat == "CycloneDX"
            and (.metadata.component.name == "rustsdcmcp")
            and (.components | type == "array" and length > 0)
            and any(.components[]; .name == "serde")
            and any(.components[]; .name == "mecmcp-auth")
          ' >/dev/null
          ! tar -xOf "$archive" "${sboms[0]}" | grep -Fq "$GITHUB_WORKSPACE"
          ! tar -xOf "$archive" "${sboms[0]}" | grep -Eq '"/(home|workspace|workspaces)/'
      - name: Verify exact upload artifact set
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          artifact_dir="dist/$SOURCE_SHA"
          mapfile -t archives < <(find "$artifact_dir" -maxdepth 1 -type f -name 'rustsdcmcp_*_amd64.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "${archive}.sha256"
          test ! -L "$archive"
          test ! -L "${archive}.sha256"
          mapfile -t artifact_entries < <(find -P "$artifact_dir" -mindepth 1 -maxdepth 1 -printf '%f\t%y\n' | LC_ALL=C sort)
          test "${#artifact_entries[@]}" -eq 2
          test "${artifact_entries[0]}" = "$(basename -- "$archive")"$'\t'f
          test "${artifact_entries[1]}" = "$(basename -- "${archive}.sha256")"$'\t'f
      - name: Upload lab package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustsdcmcp-lab-${{ steps.source.outputs.sha }}
          path: dist/${{ steps.source.outputs.sha }}/*
          if-no-files-found: error
