name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 1.97
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1.97.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88 check --workspace --all-targets --locked

  packaging:
    name: Lab package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          version: 0.70.0
      - name: Shellcheck packaging scripts
        run: shellcheck scripts/build-lab-package.sh scripts/verify-packaging.sh packaging/lxc/install.sh packaging/tests/package-smoke.sh
      - name: Verify packaging policy
        run: scripts/verify-packaging.sh
      - name: Build lab package
        run: scripts/build-lab-package.sh
      - name: Smoke test package
        run: packaging/tests/package-smoke.sh dist/rustsdcmcp_*_amd64.tar.gz
      - name: Inspect package GLIBC floor
        run: |
          tar -xOf dist/rustsdcmcp_*_amd64.tar.gz '*/BUILD-INFO' | grep -E '^glibc_floor=[0-9]+(\.[0-9]+)+$'
      - name: Upload lab package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustsdcmcp-lab-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
