name: Security

on:
  # Scoped to main for the same reason as ci.yml: a bare `push:` doubled every
  # PR-branch run against the `pull_request` event without the concurrency
  # group collapsing them.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan: the shared mechubsec workflow (pinned gitleaks binary; no
  # license needed, unlike gitleaks-action on org repos).
  secrets:
    uses: mechubsec/.github/.github/workflows/gitleaks.yml@fb1a159c596bf2c57b9f6f1ff99f546463a6a84a
    with:
      full-history: true

  dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit advisories
        run: cargo audit --deny warnings
      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - run: trivy fs --scanners vuln,misconfig,secret --exit-code 1 .
