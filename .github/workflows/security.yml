name: Security

on:
  # Scoped to main for the same reason as ci.yml: a bare `push:` doubled every
  # PR-branch run against the `pull_request` event without the concurrency
  # group collapsing them.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" |
            sha256sum --check --strict
          tar --extract --gzip --file="$archive" --directory="$RUNNER_TEMP" gitleaks
      - name: Scan full Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit advisories
        run: cargo audit --deny warnings
      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check advisories licenses bans sources
      - name: Self-check -- advisories check must fail on a known-vulnerable dependency
        # This is not exercising the workspace: it is proving the check above
        # is not a no-op. `tests/fixtures/deny-known-advisory` pins time 0.1.45
        # (RUSTSEC-2020-0071) in a standalone crate that is deliberately
        # excluded from the workspace, so this regresses loudly if `cargo deny`
        # is ever pointed at the wrong manifest or its advisories DB goes stale.
        run: |
          if cargo deny --manifest-path tests/fixtures/deny-known-advisory/Cargo.toml check advisories; then
            echo "FAIL: cargo deny check advisories passed on a fixture with a known RUSTSEC advisory (RUSTSEC-2020-0071)"
            exit 1
          fi
          echo "PASS: cargo deny check advisories correctly rejected the known-vulnerable fixture"

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - run: trivy fs --scanners vuln,misconfig,secret --exit-code 1 .
