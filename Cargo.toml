[workspace]
members = ["crates/rustsdcmcp-core", "crates/rustsdcmcp"]
default-members = ["crates/rustsdcmcp-core", "crates/rustsdcmcp"]
resolver = "2"

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mechubsec/rustsdcmcp"
authors = ["fastrevmd-lab"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http = "1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# TEMPORARY: pinned to a rev on mechubsec/mecmcp main, not a released tag.
# mecmcp-redact (added by mecmcp#386, hardened by mecmcp#432) has not shipped
# a tagged release yet -- the latest tag, v0.24.0, predates it. Cargo requires
# every crate sourced from one git repo to resolve to the identical git ref,
# so ALL mecmcp-* crates below are pinned to this same `rev`, not just the
# one this server newly depends on -- pinning only mecmcp-redact to a later
# rev while the rest stay on `tag = "v0.24.0"` would resolve two copies of
# the mecmcp dependency graph (e.g. two incompatible `CallerCtx` types).
# Replace `rev` with a released `tag` once that history ships one. Same rev
# rustpanosmcp and rustjunosmcp pinned to for the same reason (MEC-14).
mecmcp-audit = { version = "0.24.1", git = "https://github.com/mechubsec/mecmcp", rev = "2e157e0f09894e2a5309408523c0911425eebd20" }
mecmcp-auth = { version = "0.24.1", git = "https://github.com/mechubsec/mecmcp", rev = "2e157e0f09894e2a5309408523c0911425eebd20" }
mecmcp-changeset = { version = "0.24.1", git = "https://github.com/mechubsec/mecmcp", rev = "2e157e0f09894e2a5309408523c0911425eebd20" }
mecmcp-redact = { version = "0.24.1", git = "https://github.com/mechubsec/mecmcp", rev = "2e157e0f09894e2a5309408523c0911425eebd20" }
mecmcp-runtime = { version = "0.24.1", git = "https://github.com/mechubsec/mecmcp", rev = "2e157e0f09894e2a5309408523c0911425eebd20" }
mecmcp-secret = { version = "0.24.1", git = "https://github.com/mechubsec/mecmcp", rev = "2e157e0f09894e2a5309408523c0911425eebd20" }
mecmcp-server = { version = "0.24.1", git = "https://github.com/mechubsec/mecmcp", rev = "2e157e0f09894e2a5309408523c0911425eebd20" }
mecmcp-transport = { version = "0.24.1", git = "https://github.com/mechubsec/mecmcp", rev = "2e157e0f09894e2a5309408523c0911425eebd20" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
