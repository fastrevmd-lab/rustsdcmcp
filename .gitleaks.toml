title = "rustsdcmcp gitleaks config"

[extend]
path = ".gitleaks-vendor.toml"

# crates/rustsdcmcp-core/src/redact.rs's private_key_is_redacted test (added in
# 400327e, MEC-345) asserts redact_secrets() scrubs a private_key field. The
# fixture value is a synthetic, truncated PEM literal ("AAAA" body, no real
# key material) used only to trip the pem-private-key rule's own denylist
# check; it is not a credential that ever touched a device.
[[allowlists]]
description = "Synthetic PEM literal in redact.rs private_key_is_redacted test (MEC-345), not a real key"
condition = "AND"
commits = ["400327e76226f72819616354d14d84e5b9e6153d"]
paths = [
  '''(^|/)crates/rustsdcmcp-core/src/redact\.rs$''',
]
targetRules = ["pem-private-key", "private-key"]
